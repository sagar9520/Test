# Project-wide Gradle settings.
# Gradle settings configured through the IDE *will override* any settings specified in this file.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon (AGP 8 + R8 need more than the old 1.5 GB default).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure.
android.useAndroidX=true

# Each module's R class only contains that module's own resources (smaller R classes, faster builds).
# Reference library resources through the library's own R class if ever needed from Java.
android.nonTransitiveRClass=true
